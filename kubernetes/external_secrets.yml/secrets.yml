apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: taskflow-external-secret
  namespace: taskflow
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: taskflow-secrets 
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: "taskflow/prod-secrets"
        property: db_password
    - secretKey: INTERNAL_SERVICE_TOKEN
      remoteRef:
        key: "taskflow/prod-secrets"
        property: internal_token
    - secretKey: IDENTITY_DB_DSN
      remoteRef:
        key: "taskflow/prod-secrets"
        property: identity_dsn
    - secretKey: TASKS_DB_DSN
      remoteRef:
        key: "taskflow/prod-secrets"
        property: tasks_dsn