kind: HorizontalPodAutoscaler
apiVersion: autoscaling/v2
metadata:
  name: activity-hpa
  namespace: taskflow

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: activity
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: 
          type: Utilization
          averageUtilization: 70