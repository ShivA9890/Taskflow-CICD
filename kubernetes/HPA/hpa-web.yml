kind: HorizontalPodAutoscaler
apiVersion: autoscaling/v2
metadata:
  name: taskflow-web-hpa
  namespace: taskflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: taskflow_web
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource 
      resource: 
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70