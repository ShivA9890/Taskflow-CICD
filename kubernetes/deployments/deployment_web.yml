kind: Deployment
apiVersion: apps/v1
metadata:
  name: taskflow-web
  namespace: taskflow

spec:
 selector:
  matchLabels:
    app: taskflow-web
 
 template:
    metadata:
      labels: 
        app: taskflow-web
    
    spec:
      containers:
        - name: web
          image: shivam1481/taskflow-web:6
          ports: 
            - containerPort: 80

          env:
            - name: VITE_API_BASE
              value: /api/v1

            - name: VITE_USE_MOCKS
              value: "false"
          
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

